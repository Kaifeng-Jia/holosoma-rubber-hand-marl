<svg xmlns="http://www.w3.org/2000/svg" width="880" height="415" viewBox="0 0 880 415" role="img" aria-labelledby="title desc">
<title id="title">Chair wrist-only refinement: mean palm-frame orientation error</title>
<desc id="desc">Same 235-frame CORE4D chair reference before and after wrist-only refinement. Mean angle to the calibrated demonstrated palm-frame target, in degrees. Body and object remain unchanged. Orientation accuracy does not measure physical contact.</desc>
